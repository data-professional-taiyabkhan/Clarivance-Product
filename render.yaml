# Render Blueprint: one web service (Django API + built React app) and a Postgres database.
databases:
  - name: clarivance-db
    plan: free            # free Postgres expires after 30 days on Render; move to basic-256mb before real pilot use
    region: frankfurt
    databaseName: clarivance
    user: clarivance

services:
  - type: web
    name: clarivance-prototype
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: >-
      pip install -r api/requirements.txt &&
      cd web && npm ci && npm run build
    startCommand: cd api && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 20.18.0
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clarivance-db
          property: connectionString
      - key: DEMO_PASSWORD          # protects /demo only
        sync: false
      - key: PILOT_INVITE_CODE      # registration stays closed until this is set
        sync: false
